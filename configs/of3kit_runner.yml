# Caller overlay for the of3kit_exact / of3kit_fast arms. The kit lays a --runner-yaml OVER its
# mode's own configuration, so this file holds only what the mode does not set:
#
# num_workers 0: build features in the main process. Upstream's default (10 workers, which the
# kit's loader_workers lever reduces to 1) died on a 14-chain ~5,100-token pool with only
# "DataLoader worker exited unexpectedly" and no error of its own; the same setting the of3 arm's
# configs/of3_runner.yml carries.
data_module_args:
  num_workers: 0
  num_workers_validation: 0
# Same as configs/of3_runner.yml: upstream's default writes the full per-sample PAE/PDE/contact
# matrices (write_full_confidence_scores: True in core/runners/writer.py), which the of3 arm turns
# off; the kit arms must too or the arms differ in output work, not only in code. Rows recorded
# before 2026-09-22 (of3kit_* up to 4000 tokens) were written WITH the full scores.
output_writer_settings:
  write_full_confidence_scores: false
